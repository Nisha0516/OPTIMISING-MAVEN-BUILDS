name: CI Build with Optimized Caching

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Cache Maven Build Cache
      uses: actions/cache@v4
      with:
        path: .mvn/build-cache
        key: ${{ runner.os }}-mvn-build-cache-${{ github.sha }}
        restore-keys: ${{ runner.os }}-mvn-build-cache-
        
    - name: Make Maven Wrapper Executable
      run: chmod +x ./mvnw
      working-directory: backend-java

    - name: Build with Maven (Optimized)
      working-directory: backend-java
      run: ./mvnw -B clean install -T 1C -DskipTests=true --no-transfer-progress
