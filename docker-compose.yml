version: '3.8'

services:
  # The MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: carrental-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - carrental-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The Java Spring Boot Backend API
  backend:
    build: 
      context: ./backend-java
    container_name: carrental-backend
    ports:
      - "5000:5000"
    environment:
      # Inject multiple naming conventions to ensure Spring Boot picks it up
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/car_rental
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/car_rental
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=car_rental
      - SERVER_PORT=5000
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - carrental-network

  # The React.js Frontend Application
  frontend:
    build: 
      context: ./frontend
    container_name: carrental-frontend
    ports:
      - "3000:80" # Maps localhost:3000 to Nginx port 80 inside container
    depends_on:
      - backend
    networks:
      - carrental-network

# Define explicit volumes to save database state even if containers restart
volumes:
  mongodb_data:

# Create a dedicated bridge network for secure container-to-container communication
networks:
  carrental-network:
    driver: bridge
