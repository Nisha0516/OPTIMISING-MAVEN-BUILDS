version: '3.8'

services:
  # The MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: carrental-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - carrental-network

  # The Java Spring Boot Backend API
  backend:
    build: 
      context: ./backend-java
    container_name: carrental-backend
    ports:
      - "8080:8080"
    environment:
      # Inject the internal Docker networking URL so Spring can find Mongo
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/carrental
    depends_on:
      - mongodb
    networks:
      - carrental-network

  # The React.js Frontend Application
  frontend:
    build: 
      context: ./frontend
    container_name: carrental-frontend
    ports:
      - "3000:80" # Maps localhost:3000 to Nginx port 80 inside container
    depends_on:
      - backend
    networks:
      - carrental-network

# Define explicit volumes to save database state even if containers restart
volumes:
  mongodb_data:

# Create a dedicated bridge network for secure container-to-container communication
networks:
  carrental-network:
    driver: bridge
