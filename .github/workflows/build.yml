name: 🚀 Car Rental — Optimized Maven Build CI

on:
  push:
    branches: [main, master]
    paths: ['backend-java/**', '.github/workflows/**']
  pull_request:
    branches: [main, master]

# Opt into Node.js 24 to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================================================
  # JOB 1: BEFORE — Unoptimized Baseline Build
  # Shows how slow Maven is without any optimization
  # ============================================================
  build-unoptimized:
    name: "📊 BEFORE — Unoptimized Build (1 Thread, No Cache)"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Fix: give mvnw execute permission (required on Linux/macOS)
      - name: 🔧 Make mvnw executable
        run: chmod +x backend-java/mvnw

      - name: ⏱️ Record Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # Unoptimized: single thread, no dependency cache, full clean
      - name: 🐌 Run Unoptimized Build (Single Thread)
        working-directory: backend-java
        run: ./mvnw clean compile -T 1 -DskipTests=true --no-transfer-progress

      - name: ⏱️ Display Unoptimized Build Time
        run: |
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ UNOPTIMIZED BUILD TIME: ${ELAPSED} seconds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


  # ============================================================
  # JOB 2: AFTER — Fully Optimized Build
  # All 3 optimization techniques applied
  # ============================================================
  build-optimized:
    name: "⚡ AFTER — Optimized Build (16 Threads + Dependency Cache)"
    runs-on: ubuntu-latest
    needs: build-unoptimized

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Fix: give mvnw execute permission (required on Linux/macOS)
      - name: 🔧 Make mvnw executable
        run: chmod +x backend-java/mvnw

      # OPTIMIZATION 1: Cache ~/.m2/repository between pipeline runs
      # Key = OS + hash of pom.xml (auto-invalidates when deps change)
      - name: 📦 Cache Maven Dependencies (~/.m2)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: ⏱️ Record Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # OPTIMIZATION 2 & 3: Parallel threads from maven.config + compiler flags from pom.xml
      - name: ⚡ Run Optimized Build (Parallel Threads + Cache)
        working-directory: backend-java
        run: |
          echo "Running with optimizations:"
          echo "  ✅ Parallel threads: -T 1C (from .mvn/maven.config)"
          echo "  ✅ Maven .m2 dependency cache restored"
          echo "  ✅ Compiler fork + JVM TieredStopAtLevel=1 (from pom.xml)"
          echo "──────────────────────────────────────────────"
          ./mvnw clean compile -DskipTests=true --no-transfer-progress

      - name: ⏱️ Display Optimized Build Time
        run: |
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ OPTIMIZED BUILD TIME: ${ELAPSED} seconds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # BONUS: Run compile again — nothing changed, should be instant
      - name: 🏆 Incremental Build Demo (Cache Hit — Should Be Instant)
        working-directory: backend-java
        run: |
          START=$(date +%s)
          ./mvnw compile -DskipTests=true --no-transfer-progress
          END=$(date +%s)
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🏆 INCREMENTAL BUILD TIME: $((END - START)) seconds"
          echo "  Expected: 'Nothing to compile - all classes are up to date'"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📤 Upload Compiled Classes as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: backend-java/target/classes/
          retention-days: 7
