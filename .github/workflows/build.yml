name: Backend Java CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend-java/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "backend-java/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build backend-java
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw -B clean compile -DskipTests=true --no-transfer-progress

      - name: Upload compiled classes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-java-classes
          path: backend-java/target/classes
          if-no-files-found: error
