name: 🚀 Car Rental — Optimized Maven Build CI

# ──────────────────────────────────────────────────────────────
# TRIGGER: This pipeline runs automatically on every git push
# and every Pull Request to the main/master branch.
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend-java/**'   # Only trigger when backend files change
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend-java/**'

# ──────────────────────────────────────────────────────────────
# JOBS: The pipeline has two jobs to demonstrate optimization.
# Job 1: Unoptimized build (BEFORE)  → single thread, no cache
# Job 2: Optimized build  (AFTER)    → parallel threads + cache
# ──────────────────────────────────────────────────────────────
jobs:

  # ============================================================
  # JOB 1: BEFORE — Unoptimized Baseline Build
  # Purpose: Demonstrates how slow Maven is WITHOUT optimization
  # ============================================================
  build-unoptimized:
    name: "📊 BEFORE — Unoptimized Build (1 Thread, No Cache)"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the source code from GitHub
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install Java 17 (same version used locally)
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'   # Eclipse Temurin = fast, free OpenJDK

      # Step 3: Record the start time for benchmarking
      - name: ⏱️ Record Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # Step 4: Run the UNOPTIMIZED build
      # -T 1         → Force single thread (no parallelism)
      # -DskipTests  → Skip unit tests (focus on compile speed)
      # NO cache     → Fresh compile every time (worst case)
      - name: 🐌 Run Unoptimized Build (Single Thread)
        working-directory: backend-java
        run: ./mvnw clean compile -T 1 -DskipTests=true --no-transfer-progress

      # Step 5: Calculate and display the total build time
      - name: ⏱️ Display Unoptimized Build Time
        run: |
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ UNOPTIMIZED BUILD TIME: ${ELAPSED} seconds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


  # ============================================================
  # JOB 2: AFTER — Fully Optimized Build
  # Purpose: Demonstrates all 3 optimization techniques
  # ============================================================
  build-optimized:
    name: "⚡ AFTER — Optimized Build (16 Threads + Dependency Cache)"
    runs-on: ubuntu-latest
    # This job only runs AFTER the unoptimized job completes
    # so we can compare results clearly in the GitHub UI
    needs: build-unoptimized

    steps:
      # Step 1: Download the source code from GitHub
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────────────────────────
      # OPTIMIZATION 1: Maven Dependency Cache
      # GitHub Actions caches the ~/.m2/repository folder between
      # pipeline runs. This means Maven never re-downloads JARs
      # on subsequent pushes — just like a local build.
      # Cache key is based on pom.xml — if dependencies change,
      # the cache is automatically invalidated and rebuilt.
      # ─────────────────────────────────────────────────────────
      - name: 📦 Cache Maven Dependencies (~/.m2)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 3: Record start time
      - name: ⏱️ Record Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────
      # OPTIMIZATION 2: Parallel Thread Compilation
      # -T 1C = 1 thread per CPU core on the GitHub runner
      # GitHub's ubuntu-latest runner has 4 CPU cores available
      # ─────────────────────────────────────────────────────────
      - name: ⚡ Run Optimized Build (Parallel Threads + Cache)
        working-directory: backend-java
        run: |
          echo "Running with optimizations:"
          echo "  ✅ Parallel threads: -T 1C (1 per CPU core)"
          echo "  ✅ Maven dependency cache: restored from ~/.m2"
          echo "  ✅ Skip tests: -DskipTests=true"
          echo "  ✅ Compiler fork: enabled in pom.xml"
          echo "  ✅ JVM TieredStopAtLevel=1: enabled in pom.xml"
          echo "──────────────────────────────────────────────"
          ./mvnw clean compile -DskipTests=true --no-transfer-progress

      # Step 5: Display the optimized build time
      - name: ⏱️ Display Optimized Build Time
        run: |
          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ OPTIMIZED BUILD TIME: ${ELAPSED} seconds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ─────────────────────────────────────────────────────────
      # BONUS: Second compile run — demonstrates incremental cache
      # "Nothing to compile - all classes are up to date"
      # This is the most powerful demo: ~0 seconds compile time!
      # ─────────────────────────────────────────────────────────
      - name: 🏆 Incremental Build Demo (Cache Hit — Should Be ~2 Seconds)
        working-directory: backend-java
        run: |
          echo "Running compile AGAIN without any source changes..."
          echo "Maven should detect nothing changed and skip compilation."
          echo "──────────────────────────────────────────────"
          START=$(date +%s)
          ./mvnw compile -DskipTests=true --no-transfer-progress
          END=$(date +%s)
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🏆 INCREMENTAL BUILD TIME: $((END - START)) seconds"
          echo "  Expected message: 'Nothing to compile - all classes are up to date'"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Step 6: Upload compiled classes as an artifact
      # This proves the build produced real output
      - name: 📤 Upload Compiled Classes as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: backend-java/target/classes/
          retention-days: 7
