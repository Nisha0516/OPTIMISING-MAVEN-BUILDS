name: Backend Java CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend-java/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "backend-java/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-build:
    name: Fast build (skip tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Cache local Maven build cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-maven-build-cache-${{ hashFiles('backend-java/pom.xml', 'backend-java/.mvn/extensions.xml', 'backend-java/.mvn/maven-build-cache-config.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-build-cache-

      - name: Make Maven wrapper executable
        run: |
          chmod +x ./mvnw
          sed -i 's/\r$//' ./mvnw

      - name: Build with Maven (skip tests)
        run: ./mvnw -B -DskipTests package

  verify:
    name: Verify (run tests)
    runs-on: ubuntu-latest
    needs: fast-build

    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Cache local Maven build cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-maven-build-cache-${{ hashFiles('backend-java/pom.xml', 'backend-java/.mvn/extensions.xml', 'backend-java/.mvn/maven-build-cache-config.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-build-cache-

      - name: Make Maven wrapper executable
        run: |
          chmod +x ./mvnw
          sed -i 's/\r$//' ./mvnw

      - name: Build and test with Maven
        run: ./mvnw -B -Dmaven.build.cache.enabled=false verify

      - name: Upload compiled classes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-java-classes
          path: backend-java/target/classes
          if-no-files-found: error
