name: Docker Hub Release Pipeline

on:
  push:
    branches:
      - master
      - main
    paths:
      - "backend-java/**"
      - "frontend/**"
      - ".github/workflows/docker-publish.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-and-push-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # This step requires the DOCKER_USERNAME and DOCKER_PASSWORD GitHub Secrets
      - name: Login to Docker Hub
        # We wrap this in an 'if' so the entire CI pipeline doesn't crash 
        # while you configure your credentials
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        # We only push if credentials actually exist
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend-java
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/carrental-backend:latest
          # Leverages GitHub Actions cache for blazing fast subsequent Docker builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/carrental-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
